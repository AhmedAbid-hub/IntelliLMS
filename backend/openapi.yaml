components:
  schemas:
    Announcement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        title:
          type: string
          maxLength: 180
        body:
          type: string
        published:
          type: boolean
        institute:
          type: string
          format: uuid
          readOnly: true
        unit:
          type: string
          format: uuid
          nullable: true
        offering:
          type: string
          format: uuid
          nullable: true
      required:
      - body
      - created_at
      - id
      - institute
      - title
    Assignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        title:
          type: string
          maxLength: 180
        description:
          type: string
        file:
          type: string
          format: uri
        max_marks:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        due_at:
          type: string
          format: date-time
        published:
          type: boolean
        allow_late:
          type: boolean
        allow_resubmit:
          type: boolean
        institute:
          type: string
          format: uuid
          readOnly: true
        offering:
          type: string
          format: uuid
      required:
      - created_at
      - due_at
      - id
      - institute
      - offering
      - title
    Attempt:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
        deadline:
          type: string
          format: date-time
        submitted_at:
          type: string
          format: date-time
          nullable: true
        answers: {}
        marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
          nullable: true
        manual_marks: {}
        institute:
          type: string
          format: uuid
          readOnly: true
        quiz:
          type: string
          format: uuid
        student:
          type: string
          format: uuid
      required:
      - created_at
      - deadline
      - id
      - institute
      - quiz
      - started_at
      - student
    Attendance:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        institute:
          type: string
          format: uuid
          readOnly: true
        session:
          type: string
          format: uuid
        student:
          type: string
          format: uuid
      required:
      - created_at
      - id
      - institute
      - session
      - status
      - student
    AttendanceSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        date:
          type: string
          format: date
        title:
          type: string
          default: Class meeting
          maxLength: 120
        institute:
          type: string
          format: uuid
          readOnly: true
        offering:
          type: string
          format: uuid
      required:
      - created_at
      - date
      - id
      - institute
      - offering
    Audit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        action:
          type: string
          maxLength: 100
        object_id:
          type: string
          maxLength: 60
        detail: {}
        institute:
          type: string
          format: uuid
          readOnly: true
        actor:
          type: string
          format: uuid
          nullable: true
      required:
      - action
      - created_at
      - id
      - institute
      - object_id
    BankQuestion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        prompt:
          type: string
        kind:
          $ref: '#/components/schemas/QuestionKindEnum'
        options: {}
        answer:
          type: string
        marks:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        institute:
          type: string
          format: uuid
          readOnly: true
        author:
          type: string
          format: uuid
          readOnly: true
        unit:
          type: string
          format: uuid
          nullable: true
      required:
      - author
      - created_at
      - id
      - institute
      - kind
      - prompt
    Course:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        code:
          type: string
          maxLength: 30
        name:
          type: string
          maxLength: 150
        description:
          type: string
        institute:
          type: string
          format: uuid
          readOnly: true
        unit:
          type: string
          format: uuid
          nullable: true
      required:
      - code
      - created_at
      - id
      - institute
      - name
    DayEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: |-
        * `0` - Monday
        * `1` - Tuesday
        * `2` - Wednesday
        * `3` - Thursday
        * `4` - Friday
        * `5` - Saturday
        * `6` - Sunday
    Enrollment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        active:
          type: boolean
        institute:
          type: string
          format: uuid
          readOnly: true
        offering:
          type: string
          format: uuid
        student:
          type: string
          format: uuid
      required:
      - created_at
      - id
      - institute
      - offering
      - student
    Institute:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 180
        code:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        kind:
          $ref: '#/components/schemas/InstituteKindEnum'
        active:
          type: boolean
        terminology: {}
        grading_rules: {}
      required:
      - code
      - id
      - kind
      - name
    InstituteKindEnum:
      enum:
      - school
      - college
      - university
      - other
      type: string
      description: |-
        * `school` - School
        * `college` - College
        * `university` - University
        * `other` - Other
    Lesson:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        title:
          type: string
          maxLength: 180
        body:
          type: string
        video_url:
          type: string
          format: uri
          maxLength: 200
        position:
