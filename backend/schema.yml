      required:
      - courses
      - learners
      - teacher
    Year:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 50
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        institute:
          type: string
          format: uuid
          readOnly: true
      required:
      - created_at
      - end
      - id
      - institute
      - name
      - start
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
