components:
  schemas:
    ActivityDay:
      type: object
      properties:
        date:
          type: string
          format: date
        count:
          type: integer
      required:
      - count
      - date
    ActivityKind:
      type: object
      properties:
        kind:
          type: string
        count:
          type: integer
      required:
      - count
      - kind
    Announcement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        title:
          type: string
          maxLength: 180
        body:
          type: string
        published:
          type: boolean
        institute:
          type: string
          format: uuid
          readOnly: true
        unit:
          type: string
          format: uuid
          nullable: true
        offering:
          type: string
          format: uuid
          nullable: true
        unit_label:
          type: string
          readOnly: true
