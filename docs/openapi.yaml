          format: uuid
      - in: query
        name: offering
        schema:
          type: string
          format: uuid
      - in: query
        name: ordering
        schema:
          enum:
          - title
          - -title
          - -learners
          - learners
          type: string
          minLength: 1
        description: |-
          * `title` - title
          * `-title` - -title
          * `-learners` - -learners
          * `learners` - learners
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: program
        schema:
          type: string
          format: uuid
      - in: query
        name: search
        schema:
          type: string
          maxLength: 120
      - in: query
        name: section
        schema:
          type: string
          format: uuid
      - in: query
        name: stage
        schema:
          type: integer
          maximum: 40
          minimum: 1
      - in: query
        name: term
        schema:
          type: string
          format: uuid
      - in: query
        name: unit
        schema:
          type: string
          format: uuid
      - in: query
        name: year
        schema:
          type: string
          format: uuid
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseComparisonList'
          description: ''
